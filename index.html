<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебе ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffdde1;
            background-image: linear-gradient(0deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            /* ЗМІНЕНО: Новий елегантний шрифт */
            font-family: 'Playfair Display', serif;
            color: #d63384;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p.message {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 20px;
            display: none;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            /* Важливо: дозволяє кнопці виходити за межі контейнера при русі */
            overflow: visible; 
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            /* Забезпечує плавність трансформацій для обох кнопок */
            transition: transform 0.3s ease-out, background-color 0.2s;
        }

        .btn-yes {
            background-color: #ff6b81;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            z-index: 2; /* Кнопка "Так" завжди зверху */
        }

        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #ff4757;
        }

        .btn-no {
            background-color: #f1f2f6;
            color: #57606f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            /* ЗМІНЕНО: Прибрано переходи для left/top, залишено тільки transform */
        }

    </style>
</head>
<body>

    <div class="container">
        <h1 id="question">Чи будеш ти моєю валентинкою?</h1>
        <p id="success-message" class="message">Ура! Ти зробила мене найщасливішим! ❤️<br>Чекаю на наше побачення в fifi!<br>До речі, заглянь під подушку🤭</p>
        
        <div class="buttons">
            <button class="btn-yes" onclick="acceptLove()">Так</button>
            <button class="btn-no" id="noBtn" onmouseover="moveButton()">Ні</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const message = document.getElementById('success-message');
        const buttonsDiv = document.querySelector('.buttons');
        
        let scaleSize = 1; 
        // ЗМІНЕНО: Додано змінні для відстеження поточного зміщення
        let currentX = 0;
        let currentY = 0;

        function moveButton() {
            scaleSize -= 0.02;
            if (scaleSize < 0) scaleSize = 0; 

            const moveRange = 200; // Радіус руху

            // Генеруємо випадкове зміщення відносно поточного положення
            let offsetX = (Math.random() - 0.5) * moveRange * 2;
            let offsetY = (Math.random() - 0.5) * moveRange * 2;

            // Оновлюємо загальні координати
            currentX += offsetX;
            currentY += offsetY;

            // ЗМІНЕНО: Використовуємо translate для плавного руху без стрибків
            // Це рухає кнопку від її початкової позиції
            noBtn.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scaleSize})`;
        }

        function acceptLove() {
            question.style.display = 'none';
            buttonsDiv.style.display = 'none';
            noBtn.style.display = 'none';
            message.style.display = 'block';

            launchConfetti();
            setTimeout(launchConfetti, 1000);
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
